name: pythonApp

on: push
jobs:
  PushToDockerHub:
    runs-on: self-hosted
    steps:
    - name: Code Checkout
      uses: actions/checkout@v4.4.0
    - name: Docker Login
      uses: docker/login-action@v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: build image
      run: |
        docker build -t spotifytoyoutube:${GITHUB_RUN_NUMBER} .
        docker tag spotifytoyoutube:${GITHUB_RUN_NUMBER} tunaola/babzmann-deploy:spotifytoyoutube
        docker push tunaola/babzmann:spotifytoyoutube
        
